name: Documentation

on:
  pull_request:
    branches:
      - master
    paths:
      - docs/**
      - zensical.toml
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.13"

      - name: Install locked development environment
        run: uv sync --frozen --all-groups --python "3.13"

      - name: Build documentation
        run: uv run --frozen zensical build --strict
