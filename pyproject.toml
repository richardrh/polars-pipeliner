[project]
name = "polars-pipeliner"
version = "0.1.0"
description = "Build and run dependency-ordered Polars LazyFrame queries"
readme = "README.md"
authors = [
    { name = "richardrh@github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "polars>=1.38.1",
]

[project.scripts]
polars-pipeliner = "polars_pipeliner.cli:main"

[project.optional-dependencies]
delta = [
    "deltalake>=1.6.2",
]
iceberg = [
    "pyiceberg[pyarrow,sql-sqlite]>=0.11.1",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "polars_pipeliner"

[dependency-groups]
dev = [
    "boto3>=1.40",
    "hypothesis>=6.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
